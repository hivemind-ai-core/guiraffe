[package]
name = "guiraffe-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
gpui-fast = ["gpui-kit/gpui-fast"]
instruction-counts = ["dep:iai-callgrind"]

[dependencies]
guiraffe-code.workspace = true
guiraffe-charts.workspace = true
guiraffe-flamegraph.workspace = true
guiraffe-tree.workspace = true
guiraffe-timeline.workspace = true
guiraffe-datagrid.workspace = true
guiraffe-layout.workspace = true
guiraffe-inputs.workspace = true
guiraffe-overlays.workspace = true
guiraffe-motion.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
guiraffe-flow-core.workspace = true
guiraffe-core.workspace = true
guiraffe-ui.workspace = true
guiraffe-components.workspace = true
guiraffe-windows.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
ctrlc = { version = "3", features = ["termination"] }
fs2 = "0.4"
nix = { version = "0.31", features = ["signal", "process"] }
iai-callgrind = { version = "=0.16.1", optional = true }

[dev-dependencies]
guiraffe-flow.workspace = true
guiraffe-chat.workspace = true
guiraffe-markdown.workspace = true
guiraffe-mermaid.workspace = true
guiraffe-motion.workspace = true
criterion = "0.8"

[[bench]]
name = "micro"
harness = false

[[bench]]
name = "instructions"
harness = false
required-features = ["instruction-counts"]

[[example]]
name = "production_soak"
test = true

[[bench]]
name = "production_frames"
harness = false
required-features = ["instruction-counts"]
