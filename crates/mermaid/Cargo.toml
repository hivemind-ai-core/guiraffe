[package]
name = "guiraffe-mermaid"
description = "Standalone Mermaid diagram viewer control (pan/zoom, theming)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
futures-channel = "0.3"
gpui-kit.workspace = true
guiraffe-core.workspace = true
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
guiraffe-test = { path = "../test", features = ["snapshot"] }
guiraffe-markdown = { path = "../markdown", features = ["mermaid"] }
