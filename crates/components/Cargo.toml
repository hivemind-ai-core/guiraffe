[package]
name = "guiraffe-components"
description = "Mantine-inspired components not provided by GPUI Controls."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
gpui-kit.workspace = true
guiraffe-core.workspace = true
guiraffe-motion.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
guiraffe-test = { workspace = true, features = ["snapshot", "render", "layout"] }
image = { version = "0.25", default-features = false, features = ["png"] }
proptest = "1"

[features]
gpui-fast = ["gpui-kit/gpui-fast", "guiraffe-motion/gpui-fast"]
