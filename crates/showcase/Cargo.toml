[package]
name = "guiraffe-showcase"
description = "Showcase app: every GUIraffe component, live, in both themes. A coverage test fails when a public component has no showcase entry."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
gpui-kit.workspace = true
guiraffe-core.workspace = true
guiraffe-code.workspace = true
guiraffe-commands.workspace = true
guiraffe-charts.workspace = true
guiraffe-flamegraph.workspace = true
guiraffe-tree.workspace = true
guiraffe-components.workspace = true
guiraffe-layout.workspace = true
guiraffe-icons.workspace = true
guiraffe-timeline.workspace = true
guiraffe-datagrid.workspace = true
guiraffe-sheet.workspace = true
guiraffe-dnd.workspace = true
guiraffe-chat.workspace = true
guiraffe-flow.workspace = true
guiraffe-inputs.workspace = true
chrono.workspace = true
guiraffe-markdown = { workspace = true, features = ["mermaid", "syntect"] }
guiraffe-mermaid.workspace = true
guiraffe-overlays = { workspace = true, features = ["desktop"] }
guiraffe-windows.workspace = true
guiraffe-tray = { workspace = true, features = ["native"] }
guiraffe-ui.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[dev-dependencies]
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
jsonschema = { version = "0.58", default-features = false }
gpui-kit = { workspace = true, features = ["test-support"] }
guiraffe-test = { path = "../test", features = ["snapshot", "render", "layout"] }

[features]
gpui-fast = ["gpui-kit/gpui-fast"]
