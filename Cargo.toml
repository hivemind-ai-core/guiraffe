[workspace]
members = ["crates/*", "bench", "examples/getting-started", "examples/gallery", "examples/team-tasks", "examples/desktop"]
exclude = ["vendor/gpui-base", "vendor/gpui-component", "vendor/gpui-fast-linux", "vendor/mermaid-rs-renderer", "vendor/taffy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
description = "GUI toolkit built on GPUI Kit"
homepage = "https://github.com/hivemind-ai-core/guiraffe"
repository = "git@github.com:hivemind-ai-core/guiraffe.git"
readme = "https://github.com/hivemind-ai-core/guiraffe/blob/main/README.md"

[workspace.dependencies]
smallvec = "1.16"
guiraffe-test = { path = "crates/test", version = "0.1.0" }
guiraffe-code = { path = "crates/code", version = "0.1.0" }
guiraffe-chat = { path = "crates/chat", version = "0.1.0" }
guiraffe-commands = { path = "crates/commands", version = "0.1.0" }
guiraffe-core = { path = "crates/core", version = "0.1.0" }
guiraffe-layout = { path = "crates/layout", version = "0.1.0" }
guiraffe-components = { path = "crates/components", version = "0.1.0" }
guiraffe-overlays = { path = "crates/overlays", version = "0.1.0" }
guiraffe-windows = { path = "crates/windows", version = "0.1.0" }
guiraffe-goldens = { path = "crates/goldens", version = "0.1.0" }
guiraffe-tray = { path = "crates/tray", version = "0.1.0" }
guiraffe-markdown = { path = "crates/markdown", version = "0.1.0" }
guiraffe-mermaid = { path = "crates/mermaid", version = "0.1.0" }
guiraffe-flow-core = { path = "crates/flow-core", version = "0.1.0" }
guiraffe-geometry = { path = "crates/geometry", version = "0.1.0" }
guiraffe-flow = { path = "crates/flow", version = "0.1.0" }
guiraffe-router = { path = "crates/router", version = "0.1.0" }
guiraffe-motion = { path = "crates/motion", version = "0.1.0" }
guiraffe-state = { path = "crates/state", version = "0.1.0" }
guiraffe-ui = { path = "crates/ui", version = "0.1.0" }
guiraffe-macros = { path = "crates/macros", version = "0.1.0" }
guiraffe-mocket = { path = "crates/mocket", version = "0.1.0" }
guiraffe-cli = { path = "crates/cli", version = "0.1.0" }
guiraffe-inputs = { path = "crates/inputs", version = "0.1.0" }
guiraffe-icons = { path = "crates/icons", version = "0.1.0" }
guiraffe-timeline = { path = "crates/timeline", version = "0.1.0" }
guiraffe-charts = { path = "crates/charts", version = "0.1.0" }
guiraffe-flamegraph = { path = "crates/flamegraph", version = "0.1.0" }
guiraffe-tree = { path = "crates/tree", version = "0.1.0" }
guiraffe-datagrid = { path = "crates/datagrid", version = "0.1.0" }
guiraffe-sheet = { path = "crates/sheet", version = "0.1.0" }
guiraffe-devtools = { path = "crates/devtools", version = "0.1.0" }
guiraffe-dnd = { path = "crates/dnd", version = "0.1.0" }
guiraffe-calendar = { path = "crates/calendar", version = "0.1.0" }
chrono-tz = "0.10"
gpui-kit = { version = "=0.9.1", features = ["component", "assets"] }
# The same pin as gpui-kit: the test support of the framework (the element and
# text registries the inspect API reads) lives here.
gpui-base = { version = "=0.9.1", features = ["test-support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4.38"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
gpui-fast = { path = "vendor/gpui-fast" }
gpui-fast-linux = { path = "vendor/gpui-fast-linux" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }
mermaid-rs-renderer = { path = "vendor/mermaid-rs-renderer" }
taffy = { path = "vendor/taffy" }
