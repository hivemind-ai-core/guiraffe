[package]
name = "guiraffe-windows"
description = "Rock-solid multi-window management: registry, lifecycle, cross-window messaging, persistence."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
gpui-kit.workspace = true
guiraffe-core.workspace = true
guiraffe-motion.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[dev-dependencies]
tempfile = "3"
gpui-kit = { workspace = true, features = ["test-support"] }
guiraffe-test = { workspace = true, features = ["snapshot"] }

[features]
gpui-fast = ["gpui-kit/gpui-fast", "guiraffe-motion/gpui-fast"]
