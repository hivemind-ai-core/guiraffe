[package]
name = "guiraffe-ui"
description = "Data-driven UI for GUIraffe: a document IR, pre-compiled templates with slot-indexed bindings, and a DataUi host embeddable anywhere in a static UI."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
gpui-kit.workspace = true
guiraffe-core.workspace = true
guiraffe-macros.workspace = true
guiraffe-components.workspace = true
guiraffe-layout.workspace = true
serde.workspace = true
serde_json.workspace = true
im = "15.1"

[dev-dependencies]
guiraffe-calendar.workspace = true
guiraffe-commands.workspace = true
guiraffe-charts.workspace = true
guiraffe-chat.workspace = true
guiraffe-code.workspace = true
guiraffe-datagrid.workspace = true
guiraffe-dnd.workspace = true
guiraffe-flamegraph.workspace = true
guiraffe-flow.workspace = true
guiraffe-inputs.workspace = true
guiraffe-markdown.workspace = true
guiraffe-mermaid.workspace = true
guiraffe-overlays.workspace = true
guiraffe-sheet.workspace = true
guiraffe-tree.workspace = true
guiraffe-timeline.workspace = true
guiraffe-test = { workspace = true, features = ["render"] }
guiraffe-ui = { path = ".", features = ["test-support"] }
serde_json.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }

[features]
gpui-fast = ["gpui-kit/gpui-fast"]
# Exposes document ids as debug selectors for interaction/e2e tests.
test-support = ["gpui-kit/test-support"]

[build-dependencies]
serde_json.workspace = true
