[workspace]
members = ["crates/*", "bench", "examples/ui-macro-demo"]
exclude = ["vendor/gpui-base", "vendor/gpui-component", "vendor/mermaid-rs-renderer"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
guiraffe-test = { path = "crates/test" }
guiraffe-code = { path = "crates/code" }
guiraffe-chat = { path = "crates/chat" }
guiraffe-commands = { path = "crates/commands" }
guiraffe-core = { path = "crates/core" }
guiraffe-layout = { path = "crates/layout" }
guiraffe-components = { path = "crates/components" }
guiraffe-overlays = { path = "crates/overlays" }
guiraffe-windows = { path = "crates/windows" }
guiraffe-markdown = { path = "crates/markdown" }
guiraffe-mermaid = { path = "crates/mermaid" }
guiraffe-flow-core = { path = "crates/flow-core" }
guiraffe-flow = { path = "crates/flow" }
guiraffe-router = { path = "crates/router" }
guiraffe-motion = { path = "crates/motion" }
guiraffe-state = { path = "crates/state" }
guiraffe-ui = { path = "crates/ui" }
guiraffe-macros = { path = "crates/macros" }
guiraffe-mocket = { path = "crates/mocket" }
guiraffe-cli = { path = "crates/cli" }
guiraffe-inputs = { path = "crates/inputs" }
guiraffe-icons = { path = "crates/icons" }
guiraffe-timeline = { path = "crates/timeline" }
guiraffe-charts = { path = "crates/charts" }
guiraffe-flamegraph = { path = "crates/flamegraph" }
guiraffe-tree = { path = "crates/tree" }
guiraffe-datagrid = { path = "crates/datagrid" }
guiraffe-devtools = { path = "crates/devtools" }
guiraffe-dnd = { path = "crates/dnd" }
gpui-kit = { version = "=0.9.1", features = ["component", "assets"] }
# The same pin as gpui-kit: the test support of the framework (the element and
# text registries the inspect API reads) lives here.
gpui-base = { version = "=0.9.1", features = ["test-support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
gpui-fast = { path = "vendor/gpui-fast" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }
mermaid-rs-renderer = { path = "vendor/mermaid-rs-renderer" }
