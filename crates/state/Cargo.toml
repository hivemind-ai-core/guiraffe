[package]
name = "guiraffe-state"
description = "Event-driven app state for GPUI (re-frame inspired): pure handlers, effects as data, interceptors, undo, memoized selections."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
gpui-kit.workspace = true
guiraffe-core.workspace = true
guiraffe-macros.workspace = true
imbl = "7.0"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
guiraffe-test = { workspace = true }

[features]
gpui-fast = ["gpui-kit/gpui-fast"]
