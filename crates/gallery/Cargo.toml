[package]
name = "guiraffe-gallery"
description = "Gallery / reference app showcasing GUIraffe: components, state, router, motion, flow, overlays, windows."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
guiraffe-chat.workspace = true
gpui-kit.workspace = true
guiraffe-core.workspace = true
guiraffe-components.workspace = true
guiraffe-motion.workspace = true
guiraffe-state.workspace = true
guiraffe-router.workspace = true
guiraffe-windows.workspace = true
guiraffe-overlays.workspace = true
guiraffe-flow.workspace = true
guiraffe-icons.workspace = true
anyhow.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
guiraffe-test = { path = "../test", features = ["snapshot", "render"] }

[features]
# Run with `cargo run -p guiraffe-gallery --features gpui-fast` (recommended backend for apps,
# DESIGN §2c). Not a default: inside the library workspace a default backend feature would be
# unified into every crate's build and silently disable upstream-backend testing.
gpui-fast = ["gpui-kit/gpui-fast"]
