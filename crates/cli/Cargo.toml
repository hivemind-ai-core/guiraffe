[package]
name = "guiraffe-cli"
description = "The guiraffe command: scaffold apps, preview data-UI documents with hot reload, import Mocket designs."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "guiraffe"
path = "src/main.rs"

[dependencies]
toml_edit = "0.22"
gpui-kit.workspace = true
guiraffe-core.workspace = true
guiraffe-components.workspace = true
guiraffe-commands.workspace = true
guiraffe-ui.workspace = true
guiraffe-charts.workspace = true
guiraffe-chat.workspace = true
guiraffe-code.workspace = true
guiraffe-datagrid.workspace = true
guiraffe-dnd.workspace = true
guiraffe-flamegraph.workspace = true
guiraffe-flow.workspace = true
guiraffe-inputs.workspace = true
guiraffe-layout.workspace = true
guiraffe-markdown.workspace = true
guiraffe-mermaid.workspace = true
guiraffe-overlays.workspace = true
guiraffe-tree.workspace = true
guiraffe-timeline.workspace = true
guiraffe-mocket.workspace = true
guiraffe-icons.workspace = true
guiraffe-test = { workspace = true, features = ["inspect"] }
anyhow.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
toml = "0.8"
gpui-kit = { workspace = true, features = ["test-support"] }


[features]
gpui-fast = ["gpui-kit/gpui-fast"]
