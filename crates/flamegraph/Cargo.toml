[package]
name = "guiraffe-flamegraph"
description = "Canvas-rendered flame graphs for GUIraffe"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
image = { version = "0.25", default-features = false }
gpui-kit.workspace = true
guiraffe-core.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
proptest = "1"

[features]
gpui-fast = ["gpui-kit/gpui-fast"]
