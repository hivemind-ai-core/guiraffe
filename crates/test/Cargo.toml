[package]
name = "guiraffe-test"
description = "GUIraffe test infrastructure (experimental Linux e2e probe)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
e2e = ["dep:serde", "dep:serde_json", "dep:anyhow", "dep:gpui-kit"]

offscreen = ["e2e", "gpui-kit/test-support"]
# Visual snapshots on GPUI's headless wgpu renderer (no display server needed).
snapshot = ["dep:gpui-kit", "dep:anyhow", "dep:image", "dep:guiraffe-icons", "gpui-kit/test-support", "gpui-kit/assets"]
# Render-count helpers for interaction tests.
render = []
# Layout-stability assertions (focus / hover / selected never move anything).
layout = ["dep:gpui-kit", "gpui-kit/test-support"]
# The in-process inspect and drive API (spec/21 §2): node ids, layout and
# accessibility facts, the drive API, the checks and the replay.
inspect = [
    "dep:serde",
    "dep:serde_json",
    "dep:gpui-kit",
    "dep:gpui-base",
    "dep:guiraffe-core",
    "gpui-kit/test-support",
    "snapshot",
]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
gpui-kit = { workspace = true, optional = true }
gpui-base = { workspace = true, optional = true }
guiraffe-core = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
guiraffe-icons = { workspace = true, optional = true }

[[example]]
name = "probe_app"
required-features = ["e2e"]

[[test]]
name = "e2e"
required-features = ["e2e"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[[example]]
name = "offscreen"
required-features = ["offscreen"]

[[test]]
name = "snapshot"
required-features = ["snapshot"]

[[test]]
name = "inspect"
required-features = ["inspect"]

[[test]]
name = "drive"
required-features = ["inspect"]

[[test]]
name = "checks"
required-features = ["inspect"]

[[test]]
name = "replay"
required-features = ["inspect"]

[[test]]
name = "transport"
required-features = ["inspect"]

[[test]]
name = "headless"
required-features = ["inspect"]

[[test]]
name = "focus_trap"
required-features = ["inspect"]
