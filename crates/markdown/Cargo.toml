[package]
name = "guiraffe-markdown"
description = "Fast Markdown viewer control with optional Mermaid support."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
gpui-kit.workspace = true
guiraffe-core.workspace = true
guiraffe-mermaid = { workspace = true, optional = true }
# The parser the Kit's TextView renders with, at the same version, so TOC
# entries, task markers and fence ranges address the tree that is drawn.
markdown = "=1.0.0"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[features]
default = []
mermaid = ["dep:guiraffe-mermaid"]
