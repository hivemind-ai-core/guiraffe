[package]
name = "guiraffe-flow"
description = "Fast react-flow (xyflow) style node graph editor for GPUI."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
gpui-kit.workspace = true
guiraffe-core.workspace = true
guiraffe-flow-core.workspace = true

[dev-dependencies]
anyhow.workspace = true
guiraffe-test = { workspace = true, features = ["snapshot"] }
gpui-kit = { workspace = true, features = ["test-support"] }

[features]
default = []
gpui-fast = ["gpui-kit/gpui-fast"]
