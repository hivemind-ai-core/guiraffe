name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
# Rust is pinned: compiler-diagnostic goldens and lints change with each release. Update it on
# purpose, together with the goldens in crates/macros/tests/ui.
jobs:
  checks:
    runs-on: ubuntu-24.04
    # Screenshot tests compare text pixel for pixel, so the fonts and rasterizer are pinned: this
    # image plus one dated package snapshot. Change both together and review the goldens.
    container:
      image: archlinux@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
      options: --ulimit nofile=65536:65536
    env:
      GUIRAFFE_SNAPSHOT_RENDERER: lavapipe
      CARGO_INCREMENTAL: 0
    steps:
      # The dated archive is slow and rate-limited: keep the packages between runs, let slow
      # downloads finish, and retry. Change the key together with the snapshot date.
      - uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: arch-packages-2026-11-21-v1
      - name: Pinned system packages and fonts
        shell: bash
        run: |
          echo 'Server=https://archive.archlinux.org/repos/2026/11/21/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          for attempt in 1 2 3 4; do
            if pacman -Syyuu --noconfirm --needed --disable-download-timeout base-devel git python clang cmake alsa-lib openssl libxcb libx11 libxkbcommon libxkbcommon-x11 wayland vulkan-icd-loader vulkan-swrast mesa fontconfig freetype2 libgit2 adwaita-fonts cantarell-fonts gsfonts noto-fonts noto-fonts-cjk noto-fonts-emoji ttf-bitstream-vera ttf-dejavu ttf-fira-code ttf-liberation ttf-opensans > /tmp/pacman.log 2>&1; then
              tail -n 2 /tmp/pacman.log
              exit 0
            fi
            echo "::warning title=Package install::attempt $attempt failed: $(tail -n 3 /tmp/pacman.log | tr '\n' ' ')"
            sleep $((attempt * 30))
          done
          cat /tmp/pacman.log
          echo "::error title=Package install::$(tail -n 20 /tmp/pacman.log | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')"
          exit 1
      - uses: actions/checkout@v4
      # The container runs as root and the checkout belongs to the runner's user. Tests run git.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The scaffold test resolves a new app offline, for every platform in the lockfile.
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: bash .github/scripts/test.sh --no-fail-fast --workspace --locked
      - run: bash .github/scripts/test.sh --no-fail-fast -p guiraffe-gallery --locked --features devtools --test devtools
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  gpui-fast:
    runs-on: ubuntu-24.04
    # Screenshot tests compare text pixel for pixel, so the fonts and rasterizer are pinned: this
    # image plus one dated package snapshot. Change both together and review the goldens.
    container:
      image: archlinux@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
      options: --ulimit nofile=65536:65536
    env:
      GUIRAFFE_SNAPSHOT_RENDERER: lavapipe
      CARGO_INCREMENTAL: 0
    steps:
      # The dated archive is slow and rate-limited: keep the packages between runs, let slow
      # downloads finish, and retry. Change the key together with the snapshot date.
      - uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: arch-packages-2026-11-21-v1
      - name: Pinned system packages and fonts
        shell: bash
        run: |
          echo 'Server=https://archive.archlinux.org/repos/2026/11/21/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          for attempt in 1 2 3 4; do
            if pacman -Syyuu --noconfirm --needed --disable-download-timeout base-devel git python clang cmake alsa-lib openssl libxcb libx11 libxkbcommon libxkbcommon-x11 wayland vulkan-icd-loader vulkan-swrast mesa fontconfig freetype2 libgit2 adwaita-fonts cantarell-fonts gsfonts noto-fonts noto-fonts-cjk noto-fonts-emoji ttf-bitstream-vera ttf-dejavu ttf-fira-code ttf-liberation ttf-opensans > /tmp/pacman.log 2>&1; then
              tail -n 2 /tmp/pacman.log
              exit 0
            fi
            echo "::warning title=Package install::attempt $attempt failed: $(tail -n 3 /tmp/pacman.log | tr '\n' ' ')"
            sleep $((attempt * 30))
          done
          cat /tmp/pacman.log
          echo "::error title=Package install::$(tail -n 20 /tmp/pacman.log | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')"
          exit 1
      - uses: actions/checkout@v4
      # The container runs as root and the checkout belongs to the runner's user. Tests run git.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      # The scaffold test resolves a new app offline, for every platform in the lockfile.
      - run: cargo fetch --locked
      - run: cargo build --workspace --locked --features guiraffe-bench/gpui-fast
      - run: bash .github/scripts/test.sh --no-fail-fast --workspace --locked --features guiraffe-bench/gpui-fast
  size-and-leaks:
    runs-on: ubuntu-24.04
    env:
      TMPDIR: ${{ github.workspace }}/target/tmp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies and Valgrind
        run: |
          mkdir -p "$TMPDIR"
          sudo apt-get update
          sudo apt-get install -y valgrind build-essential pkg-config clang cmake libasound2-dev libssl-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig1-dev libfreetype6-dev libegl1-mesa-dev libgit2-dev
      - run: cargo build --release --locked -p guiraffe-bench --example soak --example limits
      - name: Sweep mounted fixture sizes
        run: target/release/examples/limits --output target/PERF-LIMITS.md
      - name: Check for leaks
        run: scripts/leak-check.py --soak target/release/examples/soak --out target/leak --jobs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: size-and-leaks
          path: |
            target/PERF-LIMITS.md
            target/leak
  instructions:
    env:
      IAI_CALLGRIND_HOME: ${{ github.workspace }}/target/iai
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies and Callgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind build-essential pkg-config clang cmake libasound2-dev libssl-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig1-dev libfreetype6-dev libegl1-mesa-dev libgit2-dev
      - run: cargo install iai-callgrind-runner --version 0.16.1 --locked
      - name: Establish base instruction counts
        id: base
        env:
          # A pull request compares with its base, a push with the commit it replaced.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::warning::No base commit (new branch or rewritten history): instruction counts are not compared."
            exit 0
          fi
          git worktree add --detach "$RUNNER_TEMP/guiraffe-base" "$BASE_SHA"
          if test -f "$RUNNER_TEMP/guiraffe-base"/bench/benches/instructions.rs; then
            cd "$RUNNER_TEMP/guiraffe-base"
            cargo bench --locked -p guiraffe-bench --features instruction-counts --bench instructions -- --save-baseline=pr_base
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The base predates the benchmarks: instruction counts are not compared."
          fi
      - name: Instruction gate (2 percent)
        if: steps.base.outputs.ready == 'true'
        run: cargo bench --locked -p guiraffe-bench --features instruction-counts --bench instructions -- --baseline=pr_base --save-summary=json
      - name: Instruction counts without a base
        if: steps.base.outputs.ready != 'true'
        run: cargo bench --locked -p guiraffe-bench --features instruction-counts --bench instructions -- --save-summary=json
      - name: Mounted frame instruction scaling
        env:
          IAI_CALLGRIND_HOME: ${{ github.workspace }}/target/iai/frame-scale
        shell: bash
        run: |
          mkdir -p "$IAI_CALLGRIND_HOME"
          log="$RUNNER_TEMP/frame-scale.log"
          if ! cargo bench --locked -p guiraffe-bench --features instruction-counts --bench production_frames -- --save-summary=json > "$log" 2>&1; then
            cat "$log"
            tail -n 25 "$log" | cut -c1-280 | python3 -c 'import sys; print("::error title=Frame scaling benchmark::" + sys.stdin.read().replace("%", "%25").replace("\n", "%0A"))'
            exit 1
          fi
          cat "$log"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["IAI_CALLGRIND_HOME"]) / "guiraffe-bench/production_frames/frames"

          def instructions(case):
              report = json.loads((root / case / "summary.json").read_text())
              summary = report["profiles"][0]["summaries"]["total"]["summary"]
              metrics = summary["Callgrind"]["Ir"]["metrics"]
              current = metrics["Left"] if "Left" in metrics else metrics["Both"][0]
              return current["Int"]

          for component in ("datagrid", "code"):
              small = instructions(f"{component}_frame_100k")
              large = instructions(f"{component}_frame_10m")
              counts = f"{component} instructions: 100k={small}, 10M={large}"
              print(f"::notice title=Frame scaling::{counts}")
              if small <= 0 or large <= 0 or large * 100 > small * 102:
                  print(f"::error title=Frame scaling::{counts}. Growth exceeds 2% or counts are invalid")
                  raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instruction-counts
          path: target/iai
