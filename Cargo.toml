[workspace]
members = ["crates/*", "bench"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
guiraffe-chat = { path = "crates/chat" }
guiraffe-core = { path = "crates/core" }
guiraffe-layout = { path = "crates/layout" }
guiraffe-components = { path = "crates/components" }
guiraffe-overlays = { path = "crates/overlays" }
guiraffe-windows = { path = "crates/windows" }
guiraffe-markdown = { path = "crates/markdown" }
guiraffe-mermaid = { path = "crates/mermaid" }
guiraffe-flow-core = { path = "crates/flow-core" }
guiraffe-flow = { path = "crates/flow" }
guiraffe-router = { path = "crates/router" }
guiraffe-motion = { path = "crates/motion" }
guiraffe-state = { path = "crates/state" }
guiraffe-ui = { path = "crates/ui" }
guiraffe-mocket = { path = "crates/mocket" }
guiraffe-cli = { path = "crates/cli" }
gpui-kit = { version = "=0.9.1", features = ["component", "assets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2
