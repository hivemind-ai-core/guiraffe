[package]
name = "guiraffe-compare"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The Electron comparison app (plans/ELECTRON-COMPARISON.md), GUIraffe side."
publish = false

# A standalone app (as `guiraffe new` produces): never join the enclosing workspace.
[workspace]

[dependencies]
gpui-kit = { version = "=0.9.1", features = ["component", "assets", "gpui-fast", "syntect"] }
# gpui-kit 0.9.1 requires the pre-0.1.16 IntoElement API.
gpui-fast = "=0.1.15"
guiraffe-core = { path = "../../../crates/core" }
guiraffe-components = { path = "../../../crates/components" }
guiraffe-overlays = { path = "../../../crates/overlays" }
guiraffe-router = { path = "../../../crates/router" }
guiraffe-state = { path = "../../../crates/state" }
futures = "0.3"
guiraffe-icons = { path = "../../../crates/icons" }
guiraffe-datagrid = { path = "../../../crates/datagrid" }
guiraffe-chat = { path = "../../../crates/chat" }
guiraffe-markdown = { path = "../../../crates/markdown", features = ["syntect"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
guiraffe-test = { path = "../../../crates/test", features = ["snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 16
debug = 0
strip = true

[profile.dev.package."*"]
opt-level = 2
