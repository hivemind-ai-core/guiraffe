[graph]
all-features = true

[advisories]
yanked = "deny"
# Advisories with no fixed release, excepted one by one (KNOWN_ISSUES.md, Dependency advisories).
# Anything else still fails. Remove an entry with the dependency it names.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained, no known vulnerability in this notice" },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz: unmaintained, no known vulnerability in this notice" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib",
  "BSL-1.0", "0BSD", "CC0-1.0", "MPL-2.0", "OpenSSL", "NCSA", "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/zed-industries/xim-rs", "https://github.com/zed-industries/scap"]
