[package]
name = "guiraffe-test"
description = "GUIraffe test infrastructure (experimental Linux e2e probe)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
e2e = ["dep:serde", "dep:serde_json", "dep:anyhow", "dep:gpui-kit"]

offscreen = ["e2e", "gpui-kit/test-support"]
# Visual snapshots on GPUI's headless wgpu renderer (no display server needed).
snapshot = ["dep:gpui-kit", "dep:anyhow", "dep:image", "dep:guiraffe-icons", "gpui-kit/test-support", "gpui-kit/assets"]
# Render-count helpers for interaction tests.
render = []

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
gpui-kit = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
guiraffe-icons = { workspace = true, optional = true }

[[example]]
name = "probe_app"
required-features = ["e2e"]

[[test]]
name = "e2e"
required-features = ["e2e"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[[example]]
name = "offscreen"
required-features = ["offscreen"]

[[test]]
name = "snapshot"
required-features = ["snapshot"]
