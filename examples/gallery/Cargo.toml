[package]
name = "guiraffe-gallery"
description = "Integration reference app, GUIraffe working together: components, state, router, motion, flow, overlays, windows."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
guiraffe-chat.workspace = true
gpui-kit.workspace = true
guiraffe-core.workspace = true
guiraffe-components.workspace = true
guiraffe-motion.workspace = true
guiraffe-state.workspace = true
guiraffe-router.workspace = true
guiraffe-windows.workspace = true
guiraffe-overlays.workspace = true
guiraffe-flow.workspace = true
guiraffe-icons.workspace = true
anyhow.workspace = true
guiraffe-devtools = { workspace = true, optional = true, features = ["devtools"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
guiraffe-test = { workspace = true, features = ["snapshot", "render"] }

[features]
# Run with `cargo run -p guiraffe-gallery --features gpui-fast` (recommended backend for apps,
# docs/architecture.md). Not a default: inside the library workspace a default backend feature would be
# unified into every crate's build and silently disable upstream-backend testing.
gpui-fast = ["gpui-kit/gpui-fast", "guiraffe-devtools?/gpui-fast"]
# Developer overlay and its profiler dependencies are absent from normal builds.
devtools = ["dep:guiraffe-devtools"]
