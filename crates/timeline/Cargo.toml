[package]
name = "guiraffe-timeline"
description = "Time-based editors for GPUI: a shared time axis, Gantt charts, DAW/animation tracks, dope sheets and curve editors."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
gpui-kit.workspace = true
guiraffe-core.workspace = true

[dev-dependencies]
proptest = "1"
gpui-kit = { workspace = true, features = ["test-support"] }
guiraffe-test = { workspace = true, features = ["snapshot", "render", "layout"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
gpui-fast = ["gpui-kit/gpui-fast"]
